[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spigraph-research"
version = "0.2.0"
description = "Auditable research on statistical interaction representations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.8",
    "aeon>=1.2",
    "torch>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", "local_archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
